name: Finalize Delayed macOS Release

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Release workflow run containing the preserved signed app
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  finalize:
    name: Staple, package, and publish
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Check out workflow source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Validate source run input
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          if [[ ! "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo '::error::The source workflow run ID must contain digits only.'
            exit 1
          fi

      - name: Download encrypted macOS recovery bundle
        uses: actions/download-artifact@v4
        with:
          name: drawsy-companion-macos-recovery
          path: ${{ runner.temp }}/drawsy-recovery-encrypted
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.source_run_id }}

      - name: Decrypt macOS recovery bundle
        shell: bash
        env:
          MAC_RECOVERY_ENCRYPTION_KEY: ${{ secrets.MAC_RECOVERY_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          umask 077

          if [[ -z "$MAC_RECOVERY_ENCRYPTION_KEY" ]]; then
            echo '::error::Missing macOS recovery encryption secret.'
            exit 1
          fi

          encrypted_bundle="$(find "${RUNNER_TEMP}/drawsy-recovery-encrypted" -maxdepth 1 -type f -name '*.tar.enc' -print -quit)"
          recovery_hmac="$(find "${RUNNER_TEMP}/drawsy-recovery-encrypted" -maxdepth 1 -type f -name '*.tar.enc.hmac' -print -quit)"
          if [[ -z "$encrypted_bundle" || -z "$recovery_hmac" ]]; then
            echo '::error::The encrypted macOS recovery bundle was not found.'
            exit 1
          fi

          node --input-type=module - "$encrypted_bundle" "$recovery_hmac" <<'NODE'
          import { createHmac, timingSafeEqual } from 'node:crypto';
          import { readFileSync } from 'node:fs';

          const [inputPath, hmacPath] = process.argv.slice(2);
          const key = process.env.MAC_RECOVERY_ENCRYPTION_KEY;
          const expected = Buffer.from(readFileSync(hmacPath, 'utf8').trim(), 'hex');
          const actual = createHmac('sha256', key)
            .update(readFileSync(inputPath))
            .digest();
          if (expected.length !== actual.length || !timingSafeEqual(expected, actual)) {
            throw new Error('The macOS recovery bundle failed integrity verification.');
          }
          NODE

          decrypted_archive="${RUNNER_TEMP}/drawsy-companion-macos-recovery.tar"
          recovery_dir="${RUNNER_TEMP}/drawsy-recovery"
          mkdir -p "$recovery_dir"

          openssl enc -d -aes-256-cbc \
            -pbkdf2 \
            -iter 200000 \
            -md sha256 \
            -in "$encrypted_bundle" \
            -out "$decrypted_archive" \
            -pass env:MAC_RECOVERY_ENCRYPTION_KEY

          tar -xf "$decrypted_archive" -C "$recovery_dir"
          rm -f "$decrypted_archive"

      - name: Validate recovery metadata
        id: recovery
        shell: bash
        env:
          REQUESTED_SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail

          metadata_path="${RUNNER_TEMP}/drawsy-recovery/drawsy-companion-notarization.json"
          submission_id="$(jq -r '.submissionId' "$metadata_path")"
          release_tag="$(jq -r '.tag' "$metadata_path")"
          source_run_id="$(jq -r '.sourceRunId' "$metadata_path")"

          if [[ "$source_run_id" != "$REQUESTED_SOURCE_RUN_ID" ]]; then
            echo '::error::The recovery metadata does not belong to the requested workflow run.'
            exit 1
          fi
          if [[ ! "$submission_id" =~ ^[0-9a-fA-F-]{36}$ ]]; then
            echo '::error::The recovery metadata contains an invalid notarization submission ID.'
            exit 1
          fi
          if [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo '::error::The recovery metadata contains an invalid release tag.'
            exit 1
          fi

          {
            printf 'submission_id=%s\n' "$submission_id"
            printf 'release_tag=%s\n' "$release_tag"
          } >> "$GITHUB_OUTPUT"

      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.recovery.outputs.release_tag }}
          clean: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare notarization credential
        shell: bash
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          umask 077

          required_secrets=(APPLE_API_KEY_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER)
          for secret_name in "${required_secrets[@]}"; do
            if [[ -z "${!secret_name}" ]]; then
              echo "::error::Missing macOS notarization secret: ${secret_name}"
              exit 1
            fi
          done

          api_key_path="${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 -D > "$api_key_path"
          chmod 600 "$api_key_path"

          {
            printf 'APPLE_API_KEY=%s\n' "$api_key_path"
            printf 'APPLE_API_KEY_ID=%s\n' "$APPLE_API_KEY_ID"
            printf 'APPLE_API_ISSUER=%s\n' "$APPLE_API_ISSUER"
          } >> "$GITHUB_ENV"

      - name: Confirm Apple accepted the submission
        shell: bash
        env:
          NOTARIZATION_SUBMISSION_ID: ${{ steps.recovery.outputs.submission_id }}
        run: |
          set -euo pipefail

          result_path="${RUNNER_TEMP}/drawsy-companion-notarization-result.json"
          xcrun notarytool info "$NOTARIZATION_SUBMISSION_ID" \
            --key "$APPLE_API_KEY" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --output-format json \
            > "$result_path"

          status="$(plutil -extract status raw -o - "$result_path")"
          if [[ "$status" != 'Accepted' ]]; then
            echo "::error::Apple notarization is not ready; current status: ${status}"
            exit 1
          fi

      - name: Staple and validate preserved application
        shell: bash
        run: |
          set -euo pipefail

          archive_path="$(find "${RUNNER_TEMP}/drawsy-recovery" -maxdepth 1 -type f -name '*-signed-app.zip' -print -quit)"
          if [[ -z "$archive_path" ]]; then
            echo '::error::The preserved signed macOS application was not found.'
            exit 1
          fi

          mkdir -p release/mac-arm64
          ditto -x -k "$archive_path" release/mac-arm64

          app_path='release/mac-arm64/drawsy-companion.app'
          xcrun stapler staple "$app_path"
          xcrun stapler validate "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          spctl --assess --type execute --verbose=2 "$app_path"

          CSC_IDENTITY_AUTO_DISCOVERY=false pnpm exec electron-builder \
            --prepackaged "$app_path" \
            --mac dmg zip \
            --arm64 \
            --publish never \
            --config.mac.notarize=false

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: drawsy-companion-linux
          path: release-artifacts
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.source_run_id }}

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: drawsy-companion-windows
          path: release-artifacts
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.source_run_id }}

      - name: Assemble release and checksums
        shell: bash
        run: |
          set -euo pipefail

          find release -maxdepth 1 -type f \
            \( -name '*.dmg' -o -name '*.zip' \) \
            -exec cp '{}' release-artifacts/ \;

          (
            cd release-artifacts
            for file in *; do
              if [[ -f "$file" && "$file" != 'SHA256SUMS' ]]; then
                shasum -a 256 "$file"
              fi
            done
          ) > release-artifacts/SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.recovery.outputs.release_tag }}
          draft: false
          generate_release_notes: true
          files: |
            release-artifacts/*.dmg
            release-artifacts/*.zip
            release-artifacts/*.exe
            release-artifacts/*.AppImage
            release-artifacts/*.deb
            release-artifacts/SHA256SUMS

      - name: Clean up notarization credential
        if: always()
        shell: bash
        run: |
          if [[ -n "${APPLE_API_KEY:-}" ]]; then
            rm -f "$APPLE_API_KEY"
          fi
