name: Release Companion

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux
          - os: windows-latest
            artifact: windows
          - os: macos-latest
            artifact: macos

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail

          package_version="$(node -p "require('./package.json').version")"
          expected_tag="v${package_version}"
          if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "::error::Release tag ${GITHUB_REF_NAME} does not match package version ${package_version}."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and test
        run: pnpm run check

      - name: Prepare macOS signing credentials
        if: matrix.artifact == 'macos'
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          MAC_RECOVERY_ENCRYPTION_KEY: ${{ secrets.MAC_RECOVERY_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          umask 077

          required_secrets=(
            MAC_CSC_LINK
            MAC_CSC_KEY_PASSWORD
            APPLE_API_KEY_BASE64
            APPLE_API_KEY_ID
            APPLE_API_ISSUER
            MAC_RECOVERY_ENCRYPTION_KEY
          )

          for secret_name in "${required_secrets[@]}"; do
            if [[ -z "${!secret_name}" ]]; then
              echo "::error::Missing macOS signing secret: ${secret_name}"
              exit 1
            fi
          done

          keychain_path="${RUNNER_TEMP}/drawsy-companion-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          certificate_path="${RUNNER_TEMP}/drawsy-companion-signing.p12"
          intermediary_path="${RUNNER_TEMP}/DeveloperIDG2CA.cer"
          api_key_path="${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY_ID}.p8"

          {
            printf 'MAC_SIGNING_KEYCHAIN=%s\n' "$keychain_path"
            printf 'MAC_SIGNING_CERTIFICATE=%s\n' "$certificate_path"
            printf 'MAC_SIGNING_INTERMEDIARY=%s\n' "$intermediary_path"
            printf 'MAC_SIGNING_API_KEY=%s\n' "$api_key_path"
          } >> "$GITHUB_ENV"

          printf '%s' "$MAC_CSC_LINK" | base64 -D > "$certificate_path"
          curl --fail --silent --show-error --location \
            'https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer' \
            --output "$intermediary_path"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 -D > "$api_key_path"
          chmod 600 "$certificate_path" "$intermediary_path" "$api_key_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security default-keychain -s "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -T /usr/bin/codesign \
            -T /usr/bin/productbuild \
            -P "$MAC_CSC_KEY_PASSWORD"
          security import "$intermediary_path" \
            -k "$keychain_path" \
            -T /usr/bin/codesign \
            -T /usr/bin/productbuild
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"

          identity_hash="$(
            security find-identity -v -p codesigning "$keychain_path" \
              | awk '/Developer ID Application:/ && !hash { hash = $2 } END { print hash }'
          )"

          if [[ ! "$identity_hash" =~ ^[A-F0-9]{40}$ ]]; then
            echo '::error::The macOS signing identity was not found in the temporary keychain.'
            exit 1
          fi

          {
            printf 'CSC_KEYCHAIN=%s\n' "$keychain_path"
            printf 'CSC_NAME=%s\n' "$identity_hash"
            printf 'APPLE_API_KEY=%s\n' "$api_key_path"
            printf 'APPLE_API_KEY_ID=%s\n' "$APPLE_API_KEY_ID"
            printf 'APPLE_API_ISSUER=%s\n' "$APPLE_API_ISSUER"
          } >> "$GITHUB_ENV"

      - name: Package installer
        if: matrix.artifact != 'macos'
        run: pnpm run package

      - name: Build signed macOS application
        if: matrix.artifact == 'macos'
        shell: bash
        run: |
          set -euo pipefail

          pnpm clean
          pnpm build
          pnpm exec electron-builder \
            --mac dir \
            --arm64 \
            --publish never \
            --config.mac.notarize=false \
            --config.mac.forceCodeSigning=true \
            --config.mac.hardenedRuntime=true

          app_path='release/mac-arm64/drawsy-companion.app'
          codesign --verify --deep --strict --verbose=2 "$app_path"

          archive_path="${RUNNER_TEMP}/drawsy-companion-signed-app.zip"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "$archive_path"

          printf 'MAC_SIGNED_APP_ARCHIVE=%s\n' "$archive_path" >> "$GITHUB_ENV"

      - name: Submit macOS notarization
        if: matrix.artifact == 'macos'
        id: notarization
        shell: bash
        run: |
          set -euo pipefail

          submission_path="${RUNNER_TEMP}/drawsy-companion-notarization-submission.json"
          metadata_path="${RUNNER_TEMP}/drawsy-companion-notarization.json"

          xcrun notarytool submit "$MAC_SIGNED_APP_ARCHIVE" \
            --key "$APPLE_API_KEY" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --no-wait \
            --output-format json \
            > "$submission_path"

          submission_id="$(plutil -extract id raw -o - "$submission_path")"
          if [[ ! "$submission_id" =~ ^[0-9a-fA-F-]{36}$ ]]; then
            echo '::error::Apple did not return a valid notarization submission ID.'
            exit 1
          fi

          jq -n \
            --arg submissionId "$submission_id" \
            --arg tag "$GITHUB_REF_NAME" \
            --arg sourceRunId "$GITHUB_RUN_ID" \
            '{submissionId: $submissionId, tag: $tag, sourceRunId: $sourceRunId}' \
            > "$metadata_path"

          {
            printf 'MAC_NOTARIZATION_SUBMISSION_ID=%s\n' "$submission_id"
            printf 'MAC_NOTARIZATION_METADATA=%s\n' "$metadata_path"
            printf 'MAC_NOTARIZATION_SUBMISSION=%s\n' "$submission_path"
          } >> "$GITHUB_ENV"

      - name: Create encrypted macOS recovery bundle
        if: matrix.artifact == 'macos'
        shell: bash
        env:
          MAC_RECOVERY_ENCRYPTION_KEY: ${{ secrets.MAC_RECOVERY_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          umask 077

          if [[ -z "$MAC_RECOVERY_ENCRYPTION_KEY" ]]; then
            echo '::error::Missing macOS recovery encryption secret.'
            exit 1
          fi

          recovery_archive="${RUNNER_TEMP}/drawsy-companion-macos-recovery.tar"
          recovery_bundle="${recovery_archive}.enc"
          recovery_hmac="${recovery_bundle}.hmac"

          tar -cf "$recovery_archive" \
            -C "$RUNNER_TEMP" \
            "$(basename "$MAC_SIGNED_APP_ARCHIVE")" \
            "$(basename "$MAC_NOTARIZATION_METADATA")"

          openssl enc -aes-256-cbc \
            -salt \
            -pbkdf2 \
            -iter 200000 \
            -md sha256 \
            -in "$recovery_archive" \
            -out "$recovery_bundle" \
            -pass env:MAC_RECOVERY_ENCRYPTION_KEY

          node --input-type=module - "$recovery_bundle" "$recovery_hmac" <<'NODE'
          import { createHmac } from 'node:crypto';
          import { readFileSync, writeFileSync } from 'node:fs';

          const [inputPath, outputPath] = process.argv.slice(2);
          const key = process.env.MAC_RECOVERY_ENCRYPTION_KEY;
          const digest = createHmac('sha256', key)
            .update(readFileSync(inputPath))
            .digest('hex');
          writeFileSync(outputPath, `${digest}\n`, { mode: 0o600 });
          NODE

          rm -f "$recovery_archive"
          {
            printf 'MAC_NOTARIZATION_RECOVERY_BUNDLE=%s\n' "$recovery_bundle"
            printf 'MAC_NOTARIZATION_RECOVERY_HMAC=%s\n' "$recovery_hmac"
          } >> "$GITHUB_ENV"

      - name: Preserve encrypted macOS recovery bundle
        if: matrix.artifact == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: drawsy-companion-macos-recovery
          path: |
            ${{ env.MAC_NOTARIZATION_RECOVERY_BUNDLE }}
            ${{ env.MAC_NOTARIZATION_RECOVERY_HMAC }}
          if-no-files-found: error

      - name: Wait for macOS notarization
        if: matrix.artifact == 'macos'
        timeout-minutes: 25
        shell: bash
        run: |
          set -euo pipefail

          result_path="${RUNNER_TEMP}/drawsy-companion-notarization-result.json"
          printf 'MAC_NOTARIZATION_RESULT=%s\n' "$result_path" >> "$GITHUB_ENV"

          xcrun notarytool wait "$MAC_NOTARIZATION_SUBMISSION_ID" \
            --key "$APPLE_API_KEY" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --timeout 20m \
            --output-format json \
            > "$result_path"

          status="$(plutil -extract status raw -o - "$result_path")"
          if [[ "$status" != 'Accepted' ]]; then
            echo "::error::Apple notarization ended with status: ${status}"
            exit 1
          fi

      - name: Staple and package notarized macOS application
        if: matrix.artifact == 'macos'
        shell: bash
        run: |
          set -euo pipefail

          app_path='release/mac-arm64/drawsy-companion.app'
          xcrun stapler staple "$app_path"
          xcrun stapler validate "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          spctl --assess --type execute --verbose=2 "$app_path"

          CSC_IDENTITY_AUTO_DISCOVERY=false pnpm exec electron-builder \
            --prepackaged "$app_path" \
            --mac dmg zip \
            --arm64 \
            --publish never \
            --config.mac.notarize=false

      - name: Upload platform artifacts
        uses: actions/upload-artifact@v4
        with:
          name: drawsy-companion-${{ matrix.artifact }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

      - name: Clean up macOS signing credentials
        if: ${{ always() && matrix.artifact == 'macos' }}
        shell: bash
        run: |
          set -u

          for path in \
            "${MAC_SIGNING_CERTIFICATE:-}" \
            "${MAC_SIGNING_INTERMEDIARY:-}" \
            "${MAC_SIGNING_API_KEY:-}" \
            "${MAC_SIGNED_APP_ARCHIVE:-}" \
            "${MAC_NOTARIZATION_METADATA:-}" \
            "${MAC_NOTARIZATION_SUBMISSION:-}" \
            "${MAC_NOTARIZATION_RESULT:-}" \
            "${MAC_NOTARIZATION_RECOVERY_BUNDLE:-}" \
            "${MAC_NOTARIZATION_RECOVERY_HMAC:-}"; do
            if [[ -n "$path" ]]; then
              rm -f "$path"
            fi
          done

          if [[ -n "${MAC_SIGNING_KEYCHAIN:-}" ]]; then
            security delete-keychain "$MAC_SIGNING_KEYCHAIN" >/dev/null 2>&1 || true
          fi

  publish-release:
    name: Publish GitHub Release
    needs: package
    runs-on: ubuntu-latest

    steps:
      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: drawsy-companion-linux
          path: release-artifacts

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: drawsy-companion-windows
          path: release-artifacts

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: drawsy-companion-macos
          path: release-artifacts

      - name: Normalize release filenames
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r -d '' file; do
            normalized="${file// /.}"
            if [[ -e "$normalized" ]]; then
              echo "::error::Cannot normalize release filename because ${normalized} already exists."
              exit 1
            fi
            mv "$file" "$normalized"
          done < <(find release-artifacts -maxdepth 1 -type f -name '* *' -print0)

      - name: Generate checksums
        shell: bash
        run: |
          (
            cd release-artifacts
            find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\0' \
              | sort -z \
              | xargs -0 sha256sum
          ) > release-artifacts/SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            release-artifacts/*.dmg
            release-artifacts/*.zip
            release-artifacts/*.exe
            release-artifacts/*.AppImage
            release-artifacts/*.deb
            release-artifacts/SHA256SUMS
