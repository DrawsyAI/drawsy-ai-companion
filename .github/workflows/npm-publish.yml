name: Publish Companion CLI to npm

on:
  workflow_dispatch:
    inputs:
      auth_method:
        description: npm authentication method
        required: true
        type: choice
        default: trusted
        options:
          - trusted
          - bootstrap
  workflow_run:
    workflows:
      - Release Companion
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: companion-npm-publish
  cancel-in-progress: false

jobs:
  prepare-cli:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.validate-source.outputs.version }}
    steps:
      - name: Check out the selected source commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Validate release source and version
        id: validate-source
        shell: bash
        env:
          UPSTREAM_EVENT: ${{ github.event.workflow_run.event }}
          UPSTREAM_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          UPSTREAM_TAG: ${{ github.event.workflow_run.head_branch }}
          UPSTREAM_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "workflow_run" ]]; then
            if [[ "$UPSTREAM_EVENT" != "push" || "$UPSTREAM_REPOSITORY" != "$GITHUB_REPOSITORY" ]]; then
              echo '::error::Automatic npm publishing only accepts a tag release from this repository.'
              exit 1
            fi
            if [[ ! "$UPSTREAM_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Invalid desktop release tag: ${UPSTREAM_TAG}."
              exit 1
            fi
            if [[ "$(git rev-parse HEAD)" != "$UPSTREAM_SHA" ]]; then
              echo '::error::Checked out source does not match the successful desktop release.'
              exit 1
            fi

            git fetch --no-tags origin "refs/tags/${UPSTREAM_TAG}:refs/tags/${UPSTREAM_TAG}"
            git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
            tag_sha="$(git rev-parse --verify "${UPSTREAM_TAG}^{commit}")"
            if [[ "$tag_sha" != "$UPSTREAM_SHA" ]]; then
              echo '::error::Desktop release tag no longer points to the completed release source.'
              exit 1
            fi
            if ! git merge-base --is-ancestor "$tag_sha" refs/remotes/origin/main; then
              echo '::error::Desktop release source is not merged into main.'
              exit 1
            fi
            expected_tag="$UPSTREAM_TAG"
          else
            if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
              echo '::error::Dispatch this workflow from main.'
              exit 1
            fi

            git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
            main_sha="$(git rev-parse refs/remotes/origin/main)"
            if [[ "$GITHUB_SHA" != "$main_sha" ]]; then
              echo '::error::This run is not for the current main commit. Dispatch again from the latest main.'
              exit 1
            fi
            expected_tag=""
          fi

          version="$(node -p "require('./package.json').version")"
          cli_tag="v${version}"
          if [[ -n "$expected_tag" && "$expected_tag" != "$cli_tag" ]]; then
            echo "::error::Desktop tag ${expected_tag} does not match package version ${version}."
            exit 1
          fi

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            manual_cli_tag="cli-v${version}"
            if git show-ref --verify --quiet "refs/tags/$manual_cli_tag"; then
              tagged_sha="$(git rev-parse "refs/tags/$manual_cli_tag^{commit}")"
              if [[ "$tagged_sha" != "$GITHUB_SHA" ]]; then
                echo "::error::${manual_cli_tag} points to another source commit. Bump the CLI version before publishing."
                exit 1
              fi
            fi
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install build dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build CLI runtime
        run: pnpm run build

      - name: Package the CLI tarball
        run: node scripts/package-cli.mjs

      - name: Preserve the exact CLI package and checksum
        uses: actions/upload-artifact@v4
        with:
          name: drawsy-companion-cli-${{ github.run_id }}
          path: |
            release/cli/*.tgz
            release/cli/CLI-SHA256SUMS
          if-no-files-found: error

  publish-cli:
    if: github.event_name == 'workflow_run' || inputs.auth_method == 'trusted'
    needs: prepare-cli
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The npm CLI uses GitHub's ID token to generate provenance.
      id-token: write
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install npm CLI and verify trusted publishing requirements
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@latest
          npm_version="$(npm --version)"
          echo "npm ${npm_version}"
          NPM_VERSION="$npm_version" node -e '
            const [major, minor, patch] = process.env.NPM_VERSION.split(".").map(Number);
            if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) {
              console.error("npm 11.5.1 or later is required for trusted publishing.");
              process.exit(1);
            }
          '

      - name: Download the exact CLI package and checksum
        uses: actions/download-artifact@v4
        with:
          name: drawsy-companion-cli-${{ github.run_id }}
          path: release/cli

      - name: Verify the CLI package checksum
        run: cd release/cli && sha256sum --check CLI-SHA256SUMS

      - name: Skip an npm version that is already published
        id: npm-version
        env:
          PACKAGE_VERSION: ${{ needs.prepare-cli.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if npm view "@drawsy/companion@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
            echo 'already_published=true' >> "$GITHUB_OUTPUT"
            echo "@drawsy/companion@${PACKAGE_VERSION} is already published; skipping."
          else
            echo 'already_published=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Publish the CLI tarball with OIDC and provenance
        if: steps.npm-version.outputs.already_published != 'true'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          tarballs=(release/cli/*.tgz)
          if (( ${#tarballs[@]} != 1 )); then
            echo '::error::Expected exactly one CLI package tarball.'
            exit 1
          fi
          npm publish "${tarballs[0]}" --access public --provenance

  bootstrap-cli:
    if: github.event_name == 'workflow_dispatch' && inputs.auth_method == 'bootstrap'
    needs: prepare-cli
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Staging authenticates with the secret; npm uses the ID token for provenance.
      id-token: write
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install npm CLI and verify staged publishing requirements
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@latest
          npm_version="$(npm --version)"
          echo "npm ${npm_version}"
          NPM_VERSION="$npm_version" node -e '
            const [major, minor, patch] = process.env.NPM_VERSION.split(".").map(Number);
            if (major < 11 || (major === 11 && minor < 15)) {
              console.error("npm 11.15.0 or later is required for staged publishing.");
              process.exit(1);
            }
          '

      - name: Download the exact CLI package and checksum
        uses: actions/download-artifact@v4
        with:
          name: drawsy-companion-cli-${{ github.run_id }}
          path: release/cli

      - name: Stage the first public CLI package for review
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${NODE_AUTH_TOKEN:-}" ]]; then
            echo '::error::Set the NPM_BOOTSTRAP_TOKEN repository secret to a stage-only npm token.'
            exit 1
          fi
          shopt -s nullglob
          tarballs=(release/cli/*.tgz)
          if (( ${#tarballs[@]} != 1 )); then
            echo '::error::Expected exactly one CLI package tarball.'
            exit 1
          fi
          npm stage publish "${tarballs[0]}" --access public --provenance --ignore-scripts
