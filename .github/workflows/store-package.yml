name: Build DrawsyAI Companion Store Package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Build and validate Windows Store package
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and check
        run: pnpm run check

      - name: Build Microsoft Store AppX package
        env:
          STORE_APPX_IDENTITY_NAME: ${{ vars.STORE_APPX_IDENTITY_NAME }}
          STORE_APPX_PUBLISHER: ${{ vars.STORE_APPX_PUBLISHER }}
          STORE_APPX_PUBLISHER_DISPLAY_NAME: ${{ vars.STORE_APPX_PUBLISHER_DISPLAY_NAME }}
        run: pnpm run package:store

      - name: Validate Store package
        shell: pwsh
        env:
          STORE_APPX_IDENTITY_NAME: ${{ vars.STORE_APPX_IDENTITY_NAME }}
          STORE_APPX_PUBLISHER: ${{ vars.STORE_APPX_PUBLISHER }}
          STORE_APPX_PUBLISHER_DISPLAY_NAME: ${{ vars.STORE_APPX_PUBLISHER_DISPLAY_NAME }}
        run: |
          $ErrorActionPreference = "Stop"

          $packages = @(Get-ChildItem -Path "release" -Filter "*.appx" -File)
          if ($packages.Count -ne 1) {
            throw "Expected exactly one Store AppX package; found $($packages.Count)."
          }
          $package = $packages[0]
          $signature = Get-AuthenticodeSignature -FilePath $package.FullName
          if ($signature.Status -ne "NotSigned") {
            throw "The Store submission package must be unsigned before Microsoft certification; found $($signature.Status)."
          }

          $windowsKits = Join-Path ${env:ProgramFiles(x86)} "Windows Kits\10\bin"
          $makeAppx = Get-ChildItem -LiteralPath $windowsKits -Filter "makeappx.exe" -Recurse -File |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $makeAppx) {
            throw "Windows SDK makeappx.exe was not found for package validation."
          }

          $unpackedPath = Join-Path $env:RUNNER_TEMP "drawsy-ai-companion-appx-unpacked"
          & $makeAppx.FullName unpack /p $package.FullName /d $unpackedPath /o
          if ($LASTEXITCODE -ne 0) {
            throw "makeappx could not unpack the Store package."
          }

          $manifestPath = Join-Path $unpackedPath "AppxManifest.xml"
          if (-not (Test-Path -LiteralPath $manifestPath -PathType Leaf)) {
            throw "The Store package does not contain AppxManifest.xml."
          }
          [xml]$manifest = Get-Content -LiteralPath $manifestPath -Raw

          $identity = $manifest.Package.Identity
          if ($identity.Name -ne $env:STORE_APPX_IDENTITY_NAME) {
            throw "Package identity name does not match the configured Store identity."
          }
          if ($identity.Publisher -ne $env:STORE_APPX_PUBLISHER) {
            throw "Package publisher does not match the configured Store publisher."
          }
          $properties = $manifest.Package.Properties
          if ($properties.DisplayName -ne "DrawsyAI Companion") {
            throw "Package display name does not match DrawsyAI Companion."
          }
          if ($properties.PublisherDisplayName -ne $env:STORE_APPX_PUBLISHER_DISPLAY_NAME) {
            throw "Package publisher display name does not match Partner Center."
          }
          $version = (Get-Content -LiteralPath "package.json" -Raw | ConvertFrom-Json).version
          if ($identity.Version -ne "$version.0") {
            throw "Package version $($identity.Version) does not match package.json version $version."
          }

          $hash = (Get-FileHash -LiteralPath $package.FullName -Algorithm SHA256).Hash
          $validation = [ordered]@{
            package = $package.Name
            sha256 = $hash
            version = $identity.Version
            displayName = $properties.DisplayName
            identity = $identity.Name
            publisher = $identity.Publisher
            publisherDisplayName = $properties.PublisherDisplayName
            signatureStatus = $signature.Status.ToString()
          }
          $validation | ConvertTo-Json | Set-Content -LiteralPath "release/package-validation.json" -Encoding utf8
          $validation | ConvertTo-Json | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
          Write-Host "The package is structurally valid and unsigned for Microsoft Store certification. Microsoft signs it after certification."

      - name: Upload Windows Store package
        uses: actions/upload-artifact@v4
        with:
          name: drawsyai-companion-store-windows-v${{ github.run_number }}
          path: |
            release/*.appx
            release/package-validation.json
          if-no-files-found: error
          retention-days: 90
