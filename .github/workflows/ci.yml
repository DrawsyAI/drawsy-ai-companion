name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run static checks and tests
        run: pnpm run check

      - name: Check session startup with native Windows Codex
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $codexInstall = Join-Path $env:RUNNER_TEMP "Drawsy Codex CLI"
          npm install --prefix "$codexInstall" --no-audit --no-fund @openai/codex@0.162.1
          if ($LASTEXITCODE -ne 0) { throw "CI-only Codex installation failed." }
          $env:DRAWSY_CODEX_BIN = Join-Path $codexInstall "node_modules/.bin/codex.cmd"
          node scripts/check-windows-codex.mjs
          if ($LASTEXITCODE -ne 0) { throw "Native Windows Codex session check failed." }
